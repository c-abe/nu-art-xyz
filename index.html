<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NU — Art Prints</title>
<meta name="description" content="イラストレーター NU の作品集。40点のオリジナルイラストをアートプリントとして。">
<meta property="og:title" content="NU — Art Prints">
<meta property="og:description" content="イラストレーター NU の作品集。40点のオリジナルイラストをアートプリントとして。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nu-art.xyz/">
<meta property="og:image" content="https://nu-art.xyz/images/Chopsticks.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://nu-art.xyz/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0b;
  --fg:#f0ede6;
  --muted:#8f8b83;
  --serif:"Cormorant Garamond",serif;
  --sans:"Jost",system-ui,sans-serif;
  --nav-h:64px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--fg);
  font-family:var(--sans);font-weight:300;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- nav ---------- */
.nav{
  position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:60;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(16px,3vw,40px);
  transition:background .4s ease;
}
.nav.solid{
  background:rgba(13,13,11,.86);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(240,237,230,.08);
}
.logo{font-family:var(--serif);font-size:22px;letter-spacing:.42em;color:#fff;
  text-shadow:0 1px 14px rgba(13,13,11,.85)}
.nav-links{display:flex;gap:clamp(18px,3vw,38px);list-style:none;
  font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#fff;
  text-shadow:0 1px 14px rgba(13,13,11,.85)}
.nav-links a{opacity:.75;transition:opacity .25s}
.nav-links a:hover{opacity:1}

/* ---------- intro over the wall ---------- */
/* 作品を主役にしたいので、見出しは小さく隅に置く。
   参考サイトも名前とメニューだけで、大きな惹句は出していない。 */
/* 壁は画面より長いので、下端に置くと最下部まで送られてしまう。
   1画面分の高さを持たせ、その底に寄せて最初の画面に収める。 */
.intro{
  position:absolute;left:0;right:0;top:0;height:100svh;z-index:40;
  display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;
  padding:0 clamp(20px,5vw,60px) clamp(28px,5vh,54px);
  pointer-events:none;
  text-shadow:0 2px 22px rgba(0,0,0,.9);
  background:linear-gradient(rgba(13,13,11,.4) 0%,rgba(13,13,11,0) 30%,rgba(13,13,11,.55) 100%);
}
.intro-kicker{
  font-size:10px;letter-spacing:.34em;text-transform:uppercase;
  color:rgba(240,237,230,.85);margin-bottom:20px;
  text-shadow:0 1px 12px rgba(13,13,11,.9);
}
.intro h1{
  font-family:var(--serif);font-weight:300;
  font-size:clamp(1.6rem,3.2vw,2.6rem);line-height:1.06;letter-spacing:-.01em;
}
.intro h1 em{font-style:italic;color:rgba(240,237,230,.62)}
.scroll-cue{
  position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:rgba(240,237,230,.5);
}
.scroll-cue::after{
  content:"";display:block;width:1px;height:26px;margin:8px auto 0;
  background:linear-gradient(rgba(240,237,230,.6),transparent);
  animation:drop 2.2s ease-in-out infinite;
}
@keyframes drop{0%,100%{opacity:.2;transform:scaleY(.4);transform-origin:top}50%{opacity:1;transform:scaleY(1)}}

/* ---------- TOP：つかんで回す球 ----------
   24点を球の面に均等に貼り、放っておくとゆっくり回り続ける。
   つかむと360度どちらへも回り、離すと勢いが残ってだんだん自動回転に戻る。
   端で切れて押せない枚が出ないので、どの1点も回せば必ず手前に来る。
   敷き詰めた並べ方はインスタと同じになってしまうため、こちらにした。 */
.field{
  position:relative;height:100svh;overflow:hidden;
  touch-action:none;cursor:grab;
}
.field.grabbing{cursor:grabbing}
.field .item{
  position:absolute;top:0;left:0;
  will-change:transform,opacity;transform-origin:0 0;
  box-shadow:0 18px 50px rgba(0,0,0,.55);
  transition:box-shadow .3s ease,outline-color .3s ease;
  outline:1px solid transparent;
}
.field .item:hover{outline-color:rgba(240,237,230,.5);box-shadow:0 26px 70px rgba(0,0,0,.8)}
.field .item img{height:100%;object-fit:cover}
.field-hint{
  /* 中央下はスクロールの案内が入るので、こちらは右下に置く */
  position:absolute;right:clamp(20px,5vw,60px);bottom:26px;z-index:45;
  font-size:9px;letter-spacing:.32em;text-transform:uppercase;
  color:rgba(240,237,230,.4);pointer-events:none;
}

/* ---------- シリーズ一覧 ----------
   TOPと違って「探す」画面なので、隙間を空けて素直に並べる。 */
.wall{
  display:grid;gap:clamp(14px,2vw,30px);
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  padding:clamp(20px,4vw,56px);align-items:start;
}
.wall:empty{display:none}

.item{
  position:relative;display:block;width:100%;
  cursor:pointer;overflow:hidden;
  background:#1a1a17;
}
.item img{width:100%;height:auto;transition:transform .7s cubic-bezier(.16,1,.3,1)}
.item::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(13,13,11,0) 45%,rgba(13,13,11,.88) 100%);
  opacity:0;transition:opacity .35s ease;
}
.cap{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding:18px 16px 14px;line-height:1.3;
  opacity:0;transform:translateY(8px);
  transition:opacity .35s ease,transform .45s cubic-bezier(.16,1,.3,1);
}
.cap-no{
  font-family:var(--serif);font-size:11px;letter-spacing:.2em;
  color:rgba(240,237,230,.55);display:block;margin-bottom:4px;
}
.cap-title{font-family:var(--serif);font-size:clamp(15px,1.3vw,19px);color:#fff;display:block}
.cap-size{
  font-size:9px;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(240,237,230,.6);display:block;margin-top:5px;
}
.item:hover::after,.item:focus-visible::after{opacity:1}
.item:hover .cap,.item:focus-visible .cap{opacity:1;transform:none}
.item:hover img{transform:scale(1.05)}
.item:focus-visible{outline:2px solid var(--fg);outline-offset:-4px}
.item.hide{display:none}

/* ---------- filter bar ----------
   イントロを読んでいる間は隠し、1画面スクロールしたら降りてくる。 */
.bar{
  position:fixed;top:var(--nav-h);left:0;right:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:14px clamp(16px,3vw,40px);
  background:rgba(13,13,11,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(240,237,230,.08);
  font-size:10px;letter-spacing:.24em;text-transform:uppercase;
}
.bar-label{font-family:var(--serif);font-size:15px;letter-spacing:.16em;text-transform:none}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{
  padding:6px 13px;border:1px solid rgba(240,237,230,.18);border-radius:99px;
  font-size:10px;letter-spacing:.2em;color:var(--muted);
  transition:all .25s ease;white-space:nowrap;
}
.filters button:hover{color:var(--fg);border-color:rgba(240,237,230,.45)}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.count{color:var(--muted);white-space:nowrap}
@media (max-width:640px){
  .bar{flex-wrap:wrap;gap:10px}
  .count{display:none}
}

/* ---------- footer ---------- */
/* 壁の下端に線は引かず、そのまま黒へ溶かして「壁が途切れた」ように見せる。 */
.foot{
  padding:clamp(80px,14vh,160px) clamp(20px,5vw,72px) 60px;
  display:grid;gap:48px;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
}
.foot h2{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,5vw,3.4rem);line-height:1.05}
.foot h3{
  font-size:10px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--muted);margin-bottom:16px;font-weight:400;
}
.foot p{font-size:13px;line-height:1.9;color:var(--muted);max-width:34ch}
.foot a.link{border-bottom:1px solid rgba(240,237,230,.35);padding-bottom:2px;color:var(--fg)}
.copy{
  grid-column:1/-1;padding-top:40px;margin-top:12px;
  border-top:1px solid rgba(240,237,230,.08);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
}

/* ---------- 作品詳細 ----------
   左に「戻る」、中央に大きな作品と題名と飾ったところのサムネイル、
   右に同じシリーズの作品と購入ボタン。
   作品そのものをいちばん大きく見せたいので、文字と操作は周りに逃がしてある。 */
.detail{
  position:fixed;inset:0;z-index:100;display:none;
  background:#0d0d0b;overflow-y:auto;
}
.detail.open{display:block}
.d-wrap{
  min-height:100%;
  display:grid;
  grid-template-columns:clamp(84px,9vw,170px) minmax(0,1fr) clamp(240px,27vw,420px);
  grid-template-rows:auto minmax(0,1fr);
  gap:clamp(14px,2vh,26px) clamp(20px,3vw,48px);
  padding:clamp(26px,4vh,52px) clamp(20px,4vw,56px) clamp(40px,6vh,72px);
}

.d-back{
  grid-column:1;grid-row:2;align-self:start;
  font-size:12px;letter-spacing:.1em;color:var(--muted);
  transition:color .25s;white-space:nowrap;
}
.d-back:hover{color:var(--fg)}
.d-series{
  grid-column:2;grid-row:1;align-self:end;
  font-size:13px;letter-spacing:.1em;color:var(--fg);
}

/* 中央 */
.d-main{grid-column:2;grid-row:2;min-width:0;display:flex;flex-direction:column;gap:16px}
.d-stage{position:relative;align-self:flex-start;max-width:min(100%,560px)}
.d-stage img{
  width:100%;height:auto;max-height:62vh;object-fit:contain;
  box-shadow:0 30px 80px rgba(0,0,0,.55);
}
.d-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  font-size:30px;line-height:1;padding:18px 12px;z-index:3;
  opacity:0;transition:opacity .25s;
}
.d-stage:hover .d-arrow{opacity:.55}
.d-arrow:hover{opacity:1!important}
.d-prev{left:-6px}
.d-next{right:-6px}
.d-count{
  position:absolute;top:10px;right:12px;
  font-size:10px;letter-spacing:.24em;color:rgba(240,237,230,.55);
  text-shadow:0 1px 8px rgba(0,0,0,.8);
}
.d-title{font-family:var(--serif);font-weight:300;
  font-size:clamp(1.3rem,2.1vw,1.9rem);line-height:1.2}
.d-no{font-size:10px;letter-spacing:.26em;color:var(--muted);display:block;margin-bottom:4px}

/* 飾ったところのサムネイル */
.d-thumbs{display:flex;gap:10px;flex-wrap:wrap}
.d-thumbs button{
  flex:0 0 auto;width:86px;height:65px;overflow:hidden;
  border:1px solid rgba(240,237,230,.14);
  opacity:.55;transition:opacity .25s,border-color .25s;
}
.d-thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.d-thumbs button:hover{opacity:.9}
.d-thumbs button[aria-current="true"]{opacity:1;border-color:var(--fg)}

/* 右 */
.d-side{grid-column:3;grid-row:2;min-width:0;display:flex;flex-direction:column;gap:clamp(20px,4vh,40px)}
.d-sib{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.d-sib button{
  position:relative;overflow:hidden;aspect-ratio:.707;
  border:1px solid rgba(240,237,230,.12);
  opacity:.7;transition:opacity .25s,border-color .25s;
}
.d-sib img{width:100%;height:100%;object-fit:cover;display:block}
.d-sib button:hover{opacity:1}
.d-sib button[aria-current="true"]{opacity:1;border-color:var(--fg)}

/* 原画ではなくプリントであることを、注意書きではなく作品情報として置く */
.d-print{
  font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(240,237,230,.55);
  padding-bottom:14px;border-bottom:1px solid rgba(240,237,230,.09);
}
.d-buy{
  display:inline-block;text-align:center;padding:14px 30px;border-radius:99px;
  border:1px solid rgba(240,237,230,.4);color:var(--fg);
  font-size:11px;letter-spacing:.2em;align-self:flex-start;
  transition:background .25s,color .25s;
}
.d-buy:hover{background:var(--fg);color:var(--bg)}
.d-spec{display:grid;gap:8px;font-size:12px;line-height:1.6}
.d-spec div{display:flex;justify-content:space-between;gap:16px;
  padding-bottom:8px;border-bottom:1px solid rgba(240,237,230,.07)}
.d-spec dt{color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:10px}
.d-note{font-size:11px;line-height:1.9;color:var(--muted)}
.d-note a{border-bottom:1px solid rgba(240,237,230,.3);color:var(--fg)}
.d-close{position:fixed;top:14px;right:18px;font-size:28px;line-height:1;opacity:.6;padding:8px;z-index:5}
.d-close:hover{opacity:1}
.d-works{
  margin-top:auto;padding-top:20px;border-top:1px solid rgba(240,237,230,.09);
  display:flex;justify-content:space-between;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;
}
.d-works button{color:var(--muted);transition:color .25s}
.d-works button:hover{color:var(--fg)}

@media (max-width:900px){
  .d-wrap{
    grid-template-columns:1fr;grid-template-rows:auto auto auto auto;
    gap:18px;padding:26px 18px 40px;
  }
  .d-back{grid-column:1;grid-row:1}
  .d-series{grid-column:1;grid-row:2}
  .d-main{grid-column:1;grid-row:3}
  .d-side{grid-column:1;grid-row:4}
  .d-stage img{max-height:52vh}
  .d-arrow{opacity:.5}
}
body.locked{overflow:hidden}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<nav class="nav" id="nav">
  <div class="logo">NU</div>
  <ul class="nav-links">
    <li><a href="#wall">Works</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#shop">Shop</a></li>
  </ul>
</nav>

<main>
  <div style="position:relative">
    <div class="intro" id="intro">
      <span class="intro-kicker">Art prints by NU — limited edition</span>
      <h1>Illustrations <em>made to live</em> on your wall</h1>

    <section class="wall" id="wall" aria-label="シリーズの作品"></section>
  </div>
</main>

<div class="bar" id="works">
  <span class="bar-label">Collection</span>
  <div class="filters" id="filters" role="group" aria-label="シリーズで絞り込み"></div>
  <span class="count" id="count"></span>
</div>

<footer class="foot" id="about">
  <div>
    <h2>NU</h2>
    <p style="margin-top:20px">
      プリントを購入できます。
    </p>
  </div>
  <div id="shop">
    <h3>Shop</h3>
    <p>
      プリントのご注文・原画のお問い合わせはこちらから。<br>
      <a class="link" href="#">オンラインストア</a>
    </p>
  </div>
  <div class="copy">
    <span>Printed &amp; shipped via Graphic</span>
    <span>&copy; NU</span>
  </div>
</footer>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-label="作品詳細">
  <button class="d-close" id="dClose" aria-label="閉じる">&times;</button>
  <div class="d-wrap">
    <button class="d-back" id="dBack">&#8592; Back</button>
    <span class="d-series" id="dSeries"></span>

    <div class="d-main">
      <div class="d-stage">
        <span class="d-count" id="dCount"></span>
        <button class="d-arrow d-prev" id="dPrev" aria-label="前の写真">&#8249;</button>
        <img id="dImg" alt="">
        <button class="d-arrow d-next" id="dNext" aria-label="次の写真">&#8250;</button>
      </div>
      <h2 class="d-title"><span class="d-no" id="dNo"></span><span id="dTitle"></span></h2>
      <div class="d-thumbs" id="dThumbs" role="tablist" aria-label="この作品を飾ったところ"></div>
    </div>

    <div class="d-side">
      <div class="d-sib" id="dSib" aria-label="同じシリーズの作品"></div>
      <p class="d-print">Archival Pigment Print</p>
      <a class="d-buy" id="dBuy" href="#" target="_blank" rel="noopener">Shop で購入する</a>
      <dl class="d-spec" id="dSpec"></dl>
      <p class="d-note" id="dNote"></p>
      <div class="d-works">
        <button id="dWorkPrev">&#8592; 前の作品</button>
        <button id="dWorkNext">次の作品 &#8594;</button>
      </div>
    </div>
  </div>
</div>

/* ---------- 球 ---------- */

/* 球の面に均等に散らす（フィボナッチ）。緯度で輪切りにすると極が混む。 */
function spherePoints(n){
  return Array.from({length: n}, (_, i) => {
    const y = n === 1 ? 0 : 1 - (i / (n - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = i * 2.39996;                     // 黄金角
    return [Math.cos(th) * r, y, Math.sin(th) * r];
  });
}

const sph = {
  yaw: 0.4, pitch: -0.12, vYaw: 0, vPitch: 0,
  drag: null, moved: 0, focus: null, pts: [], on: []
};
const AUTO = 0.028;            // 放っておいたときの回る速さ（rad/秒）。ゆっくり
const PITCH_MAX = 1.15;

function fillSphere(){
  sph.on = cards.filter(c => !c.classList.contains('hide'));
  sph.pts = spherePoints(sph.on.length);
  field.querySelectorAll('.item').forEach(e => e.remove());
  sph.on.forEach(c => field.appendChild(c));
}

field.addEventListener('pointerdown', e => {
  if (view || still) return;
  sph.drag = { x: e.clientX, y: e.clientY };
  sph.moved = 0;
  sph.vYaw = sph.vPitch = 0;
  sph.focus = null;
  field.setPointerCapture(e.pointerId);
  field.classList.add('grabbing');
});
field.addEventListener('pointermove', e => {
  if (!sph.drag) return;
  const dx = e.clientX - sph.drag.x, dy = e.clientY - sph.drag.y;
  sph.drag = { x: e.clientX, y: e.clientY };
  sph.moved += Math.abs(dx) + Math.abs(dy);
  const k = 3.2 / Math.min(innerWidth, innerHeight);   // 画面の大小で感触が変わらないように
  sph.yaw  += dx * k;
  sph.pitch = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, sph.pitch + dy * k));
  sph.vYaw   = dx * k * 12;                            // 離したあとに残す勢い
  sph.vPitch = dy * k * 12;
});
const letGo = () => { sph.drag = null; field.classList.remove('grabbing'); };
field.addEventListener('pointerup', letGo);
field.addEventListener('pointercancel', letGo);

function spinTo(k, then){
  const [x, y, z] = sph.pts[k];
  // 回りきってから進むが、描画ループが止まっている環境（裏タブ、省電力、
  // 動きを切っている端末）では回りきる判定に届かない。
  // そこで時間でも必ず進むようにして、押しても何も起きない状態を作らない。
  let done = false;
  const go = () => {
    if (done) return;
    done = true;
    sph.focus = null;
    then();
  };
  sph.focus = { yaw: Math.atan2(-x, z), pitch: Math.atan2(y, Math.hypot(x, z)), then: go };
  setTimeout(go, 480);
}

function drawSphere(dt){
  if (sph.focus){
    // 選んだ1点が正面に来るまで、いちばん近い向きに回してから開く
    let d = (sph.focus.yaw - sph.yaw + Math.PI) % (Math.PI * 2);
    if (d < 0) d += Math.PI * 2;
    d -= Math.PI;
    const e = Math.min(1, dt * 4.5);
    sph.yaw   += d * e;
    sph.pitch += (sph.focus.pitch - sph.pitch) * e;
    if (Math.abs(d) < 0.02 && Math.abs(sph.focus.pitch - sph.pitch) < 0.02){
      const done = sph.focus.then;
      sph.focus = null; sph.vYaw = sph.vPitch = 0;
      if (done) done();
    }
  } else if (!sph.drag){
    sph.vYaw   *= 0.94;                         // 慣性。だんだん自動回転に戻る
    sph.vPitch *= 0.90;
    sph.yaw   += (sph.vYaw + AUTO) * dt;
    sph.pitch  = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, sph.pitch + sph.vPitch * dt));
  }

  // clientWidth はレイアウト前や検査環境で 0 になる。窓の大きさで代用する。
  const W = field.clientWidth || innerWidth, H = field.clientHeight || innerHeight;
  if (!W || !H) return;
  const cy = Math.cos(sph.yaw),   sy = Math.sin(sph.yaw);
  const cp = Math.cos(sph.pitch), sp = Math.sin(sph.pitch);
  // 球の半径。1点の高さの半分を足しても画面から出ない大きさに抑える。
  // はみ出すと下端の作品が切れて押しにくくなる。
  const R = Math.min(W, H) * 0.40;
  const FOV = R * 3.1;                          // 大きいほど遠近が弱い
  // 1点の大きさ。24点ぶんの面積が球の見かけの面積をやや上回るくらいにする。
  // 大きすぎると重なって潰れ、小さすぎると散らかって見える。
  const size = Math.min(W, H * 1.5) * (W < 700 ? 0.34 : 0.26) * 0.40;

  sph.on.forEach((el, k) => {
    const [x, y, z] = sph.pts[k];
    const x1 =  x * cy + z * sy, z1 = -x * sy + z * cy;   // Y軸まわり（横）
    const y2 =  y * cp - z1 * sp, z2 = y * sp + z1 * cp;  // X軸まわり（縦）
    const persp = FOV / (FOV + z2 * R);
    const d = (z2 + 1) / 2;                     // 0=奥 1=手前
    const wk = WORKS[+el.dataset.i];
    const w = size * persp;
    const h = w * wk.h / wk.w;
    el.style.width   = w.toFixed(1) + 'px';
    el.style.height  = h.toFixed(1) + 'px';
    el.style.opacity = (0.20 + d * 0.80).toFixed(3);
    el.style.filter  = d < 0.94 ? 'blur(' + ((1 - d) * 6).toFixed(1) + 'px)' : 'none';
    el.style.zIndex  = Math.round(d * 200);
    el.style.transform = 'translate3d(' +
      (W / 2 + x1 * R * persp - w / 2).toFixed(1) + 'px,' +
      (H * 0.53 + y2 * R * persp - h / 2).toFixed(1) + 'px,0)';
    // 奥にあるものは押せない。手前の1点と取り違えない
    el.style.pointerEvents = d > 0.5 ? 'auto' : 'none';
  });
}

let last = performance.now();
function frame(now){
  const dt = Math.min((now - last) / 1000, 0.05);   // タブを離れても飛ばない
  last = now;
  if (!view && !still) drawSphere(dt);
  requestAnimationFrame(frame);
}

/* ---------- シリーズ一覧（隙間を空けて並べる） ---------- */
function layout(){
  const order = [...cards].sort((a, b) => {
    const A = WORKS[+a.dataset.i], B = WORKS[+b.dataset.i];
    return A.sr === B.sr ? +a.dataset.i - +b.dataset.i
                         : SERIES.indexOf(A.sr) - SERIES.indexOf(B.sr);
  });
  wall.textContent = '';
  order.forEach(c => { if (!c.classList.contains('hide')) wall.appendChild(c); });
}

/* ---- どこを見ているか ----
   TOP は各シリーズ4点ずつの24点だけ。作品が増えても TOP は増えない。
   TOP で1点選ぶとそのシリーズの一覧へ、そこで選ぶと作品の詳細へ進む。 */
let view = null;                       // null = TOP、文字列 = そのシリーズ

const filters = document.getElementById('filters');
const countEl = document.getElementById('count');
const barLabel = document.querySelector('.bar-label');

function inView(i){
  return view ? WORKS[i].sr === view : !!WORKS[i].top;
}
function visibleIndexes(){
  return WORKS.map((w, i) => i).filter(inView);
}

/* 詳細画面はシリーズを単位にする。右に並ぶのも、前後に送るのも同じシリーズ。
   TOPは各シリーズ4点だけなので、そこを単位にすると残りへ辿り着けない。 */
function seriesOf(i){
  const sr = WORKS[i].sr;
  return WORKS.map((w, j) => j).filter(j => WORKS[j].sr === sr);
}

function buildNav(){
  filters.textContent = '';
  const mk = (label, val) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.setAttribute('aria-pressed', view === val);
    b.onclick = () => show(val);
    filters.appendChild(b);
  };
  mk('Top', null);
  SERIES.forEach(s => mk(s, s));
}

function show(next){
  view = next;
  barLabel.textContent = view || 'Selected works';
  cards.forEach(el => el.classList.toggle('hide', !inView(+el.dataset.i)));
  [...filters.children].forEach((b, k) =>
    b.setAttribute('aria-pressed', (k === 0 ? null : SERIES[k - 1]) === view));
  const n = visibleIndexes().length;
  countEl.textContent = view ? n + ' works' : SERIES.length + ' series · ' + n + ' shown';

  const asSphere = !view && !still;
  field.hidden = !asSphere;
  if (asSphere){
    wall.textContent = '';
    fillSphere();
    drawSphere(0);                      // 描画ループを待たずに置く（裏タブ対策）
  } else {
    field.querySelectorAll('.item').forEach(e => {
      e.removeAttribute('style');       // 球で入れた位置と大きさを捨てる
      e.style.background = WORKS[+e.dataset.i].c;
    });
    layout();
  }
  scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---- 作品詳細 ----
   1作品につき「原画 + 部屋に飾った5カット」を1枚ずつ見せる。
   カット画像は images/scenes/<作品番号2桁>_<カット番号>.webp。
   tools/make_mockups.py が index.html の WORKS 順で書き出すので、
   作品を1枚足してこのスクリプトを流せば詳細画面もそのまま増える。 */

/* BASE ショップ。作品ごとの商品ID(b)・価格(p)・サイズ(sz) は WORKS 側に持たせてある。
   live を false にしている間は購入ボタンを出さず DM 案内だけにする。
   BASE かんたん決済の審査が通ってショップが公開されたら true にする。 */
const SHOP = {
  url: 'https://artline.shopselect.net',
  live: false,
  contact: 'https://www.instagram.com/'
};

/* 作品ごとのカット枚数は一定ではない。横長の作品は横向きの額しか使わないので
   縦の作品より少ない。枚数は作品データの k に持たせてある。
   別ファイルを取りに行かせると、読めなかったときに存在しない画像を並べてしまう。 */

const detail   = document.getElementById('detail');
const dImg     = document.getElementById('dImg');
const dThumbs  = document.getElementById('dThumbs');
const dCount   = document.getElementById('dCount');
const dNo      = document.getElementById('dNo');
const dTitle   = document.getElementById('dTitle');
const dSpec    = document.getElementById('dSpec');
const dBuy     = document.getElementById('dBuy');
const dNote    = document.getElementById('dNote');
const dSeries  = document.getElementById('dSeries');
const dSib     = document.getElementById('dSib');

let curWork = 0, curSlide = 0, slides = [], opener = null;


function buildSlides(i){
  const n = String(i + 1).padStart(2, '0');
  const out = [{ src: 'images/' + encodeURIComponent(WORKS[i].f), label: '作品' }];
  for (let c = 1; c <= (WORKS[i].k || 0); c++){
    out.push({ src: 'images/scenes/' + n + '_' + c + '.webp' + IMG_VER, label: '飾ったところ ' + c });
  }
  return out;
}

function showSlide(k){
  curSlide = (k + slides.length) % slides.length;
  const s = slides[curSlide];
  dImg.src = s.src;
  dImg.alt = WORKS[curWork].t + ' — ' + s.label;
  dCount.textContent = (curSlide + 1) + ' / ' + slides.length;
  [...dThumbs.children].forEach((b, j) =>
    b.setAttribute('aria-current', j === curSlide));
  const act = dThumbs.children[curSlide];
  // scrollIntoView は見栄えの調整でしかないので、
  // ここで落ちて詳細画面が開かなくなることのないよう握りつぶす
  try { act && act.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' }); }
  catch (_) {}
}

function showWork(i){
  curWork = i;
  const wk = WORKS[i];
  slides = buildSlides(i);

  dThumbs.textContent = '';
  slides.forEach((s, j) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', s.label);
    const im = document.createElement('img');
    im.src = s.src; im.alt = ''; im.loading = 'lazy'; im.decoding = 'async';
    b.appendChild(im);
    b.onclick = () => showSlide(j);
    dThumbs.appendChild(b);
  });

  const vis = seriesOf(i);
  dNo.textContent = 'No.' + String(i + 1).padStart(2, '0')
                  + '   /   ' + (vis.indexOf(i) + 1) + ' of ' + vis.length;
  dTitle.textContent = wk.t;
  dSeries.textContent = wk.sr || '';

  /* 右側は同じシリーズの作品。押すと詳細を差し替える。
     一覧に戻らずに隣の作品へ移れるので、見比べやすい。 */
  dSib.textContent = '';
  vis.forEach(j => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', WORKS[j].t + ' を見る');
    b.setAttribute('aria-current', j === i);
    const im = document.createElement('img');
    im.src = 'images/thumbs/' + String(j + 1).padStart(2, '0') + '.webp';
    im.alt = WORKS[j].t; im.loading = 'lazy'; im.decoding = 'async';
    b.appendChild(im);
    b.onclick = () => showWork(j);
    dSib.appendChild(b);
  });

  dSpec.textContent = '';
  const yen = n => '¥' + n.toLocaleString('ja-JP');
  const rows = [
    ['Size',  wk.sz || '—'],
    ['Price', wk.p ? yen(wk.p) : 'お問い合わせ']
  ];
  rows.forEach(([k, v]) => {
    const row = document.createElement('div');
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    row.append(dt, dd); dSpec.appendChild(row);
  });

  if (SHOP.live && wk.b){
    dBuy.href = SHOP.url + '/items/' + wk.b;
    dBuy.textContent = 'Shop で購入する　' + yen(wk.p);
    dBuy.style.display = '';
    dNote.innerHTML = 'ほかのサイズ・額装・原画のご相談は<a href="' + SHOP.contact
                    + '" target="_blank" rel="noopener">DM</a>からお願いします。';
  } else {
    dBuy.style.display = 'none';
    dNote.innerHTML = 'ただいまオンラインストアを準備中です。ご購入・サイズのご相談は'
                    + '<a href="' + SHOP.contact + '" target="_blank" rel="noopener">DM</a>'
                    + 'からお願いします。';
  }

  showSlide(0);
  detail.scrollTop = 0;
}

function openDetail(i, el){
  opener = el;
  showWork(i);
  detail.classList.add('open');
  document.body.classList.add('locked');
  document.getElementById('dClose').focus();
}
function closeDetail(){
  detail.classList.remove('open');
  document.body.classList.remove('locked');
  dImg.removeAttribute('src');
  if (opener) opener.focus();
}
function stepWork(d){
  const vis = seriesOf(curWork);
  if (!vis.length) return;
  const p = vis.indexOf(curWork);
  showWork(vis[(p + d + vis.length) % vis.length]);
}

document.addEventListener('click', e => {
  const it = e.target.closest('.item');
  if (!it) return;
  const i = +it.dataset.i;
  // TOP から押したときは、その1点を正面に回してから詳細を開く。
  // 詳細の右に同じシリーズが全部並ぶので、間に一覧を挟む必要がない。
  if (!view && !still){
    if (sph.moved > 8) return;          // つかんで回しただけ。選んだことにしない
    const k = sph.on.indexOf(it);
    if (k < 0) return openDetail(i, it);
    spinTo(k, () => openDetail(i, it));
  } else {
    openDetail(i, it);
  }
});
document.getElementById('dClose').onclick = closeDetail;
document.getElementById('dBack').onclick = closeDetail;
document.getElementById('dPrev').onclick = () => showSlide(curSlide - 1);
document.getElementById('dNext').onclick = () => showSlide(curSlide + 1);
document.getElementById('dWorkPrev').onclick = () => stepWork(-1);
document.getElementById('dWorkNext').onclick = () => stepWork(1);

addEventListener('keydown', e => {
  if (!detail.classList.contains('open')) return;
  if (e.key === 'Escape')     closeDetail();
  if (e.key === 'ArrowLeft')  showSlide(curSlide - 1);
  if (e.key === 'ArrowRight') showSlide(curSlide + 1);
  if (e.key === 'ArrowUp')   { e.preventDefault(); stepWork(-1); }
  if (e.key === 'ArrowDown') { e.preventDefault(); stepWork(1); }
});

/* スマホ用のスワイプ */
let tx = 0;
dImg.addEventListener('touchstart', e => { tx = e.changedTouches[0].clientX; }, {passive:true});
dImg.addEventListener('touchend', e => {
  const d = e.changedTouches[0].clientX - tx;
  if (Math.abs(d) > 45) showSlide(curSlide + (d < 0 ? 1 : -1));
}, {passive:true});

show(null);
if (!still){
  requestAnimationFrame(frame);
  // 最初の描画前は要素の大きさが 0 で、窓の大きさで代用している。
  // 実際に置かれたあとにもう一度置き直す。
  addEventListener('load', () => { if (!view) drawSphere(0); });
  if (typeof ResizeObserver === 'function'){
    new ResizeObserver(() => { if (!view) drawSphere(0); }).observe(field);
  }
}
</script>
</body>
</html>
